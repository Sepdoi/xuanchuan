        const CopyTrigger = ({ text, className, iconSize = 16 }) => {
          const [copied, setCopied] = useState(false);

          const handleCopy = async (e) => {
            e.preventDefault();
            e.stopPropagation();

            const fallbackCopy = (textToCopy) => {
              const textArea = document.createElement("textarea");
              textArea.value = textToCopy;
              textArea.style.position = "fixed";
              textArea.style.left = "-9999px";
              textArea.style.top = "0";
              document.body.appendChild(textArea);
              textArea.focus();
              textArea.select();
              
              try {
                const successful = document.execCommand('copy');
                if (successful) {
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                }
              } catch (err) {
                console.error('Fallback copy failed', err);
              }
              
              document.body.removeChild(textArea);
            };
            
            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(text);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                } catch (err) {
                    fallbackCopy(text);
                }
            } else {
                fallbackCopy(text);
            }
          };

          return (
            <button
              onClick={handleCopy}
              className={`flex items-center justify-center transition-all duration-200 active:scale-90 z-20 ${className} ${
                copied ? 'text-green-400 bg-green-400/10' : 'hover:text-white hover:bg-white/10'
